name: kernel-build

on:
  push:
    branches:
      - test-24.0
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  LLVM: 1
  LLVM_IAS: 1
  CROSS_COMPILE: aarch64-linux-gnu-
  OUT_DIR: out
  DEFCONFIG: redbull_defconfig
  AK3_COMMIT: af770f7b16cf8f8eb7c68614b2a693b3b361c90c
  NEUTRON_VERSION: 30072026
  KERNEL_NAME: Aether-Foundry

jobs:
  build:
    name: Build Aether-Foundry redbull kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: test-24.0
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio flex git libelf-dev libssl-dev \
            lz4 zip unzip python3 curl kmod file

      - name: Setup Neutron Clang
        run: |
          set -euo pipefail
          TOOLCHAIN_DIR="$RUNNER_TEMP/neutron-clang"
          mkdir -p "$TOOLCHAIN_DIR"
          cd "$TOOLCHAIN_DIR"

          curl -fsSLO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S="${NEUTRON_VERSION}"

          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip aarch64-linux-gnu-ld; do
            test -x "$TOOLCHAIN_DIR/bin/$tool"
          done

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"
          echo "NEUTRON_TOOLCHAIN=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"

      - name: Verify Neutron toolchain
        run: |
          set -euo pipefail
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip aarch64-linux-gnu-ld; do
            test "$(command -v "$tool")" = "${NEUTRON_TOOLCHAIN}/bin/$tool"
          done

          clang --version
          ld.lld --version
          aarch64-linux-gnu-ld --version
          test "$(clang --target=aarch64-linux-gnu -dumpmachine)" = "aarch64-unknown-linux-gnu"

      - name: Configure kernel
        run: |
          set -euo pipefail
          make O="${OUT_DIR}" \
            ARCH="${ARCH}" CC=clang LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" "${DEFCONFIG}"

          test -s "${OUT_DIR}/.config"
          grep -q '^CONFIG_ARM64=y' "${OUT_DIR}/.config"
          echo "Kernel: ${KERNEL_NAME}"
          echo "Defconfig: ${DEFCONFIG}"
          echo "Neutron Clang: ${NEUTRON_VERSION}"
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_KERNEL_LZ4|CONFIG_MODULES|CONFIG_MODVERSIONS)=' "${OUT_DIR}/.config" || true

      - name: Build kernel
        run: |
          set -euo pipefail
          make -j"$(nproc)" O="${OUT_DIR}" ARCH="${ARCH}" \
            CC=clang LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" Image

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          test -s "$IMAGE"
          file "$IMAGE" | grep -qi 'ARM aarch64\|ARM64\|ARM'

      - name: Build and validate modules
        run: |
          set -euo pipefail
          if grep -q '^CONFIG_MODULES=y' "${OUT_DIR}/.config"; then
            make -j"$(nproc)" O="${OUT_DIR}" ARCH="${ARCH}" \
              CC=clang LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
              CROSS_COMPILE="${CROSS_COMPILE}" modules

            test -s "${OUT_DIR}/modules.order"
            mapfile -t modules < <(find "${OUT_DIR}" -type f -name '*.ko' | sort)
            test "${#modules[@]}" -gt 0

            if grep -q '^CONFIG_MODVERSIONS=y' "${OUT_DIR}/.config"; then
              test -s "${OUT_DIR}/Module.symvers"
            fi

            kernel_release="$(make -s O="${OUT_DIR}" ARCH="${ARCH}" CC=clang LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" CROSS_COMPILE="${CROSS_COMPILE}" kernelrelease)"
            test -n "$kernel_release"
            echo "Kernel release: $kernel_release"

            for module in "${modules[@]}"; do
              test -s "$module"
              vermagic="$(modinfo -F vermagic "$module" 2>/dev/null || true)"
              test -n "$vermagic"
              echo "$(basename "$module"): $vermagic"
              case " $vermagic " in
                *" $kernel_release "*) ;;
                *) echo "ERROR: vermagic mismatch: $module"; exit 1 ;;
              esac
            done
          else
            echo "CONFIG_MODULES is disabled; no modules expected."
          fi

      - name: Compress kernel
        run: |
          set -euo pipefail
          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          lz4 -l -9 -f "$IMAGE" "${OUT_DIR}/arch/arm64/boot/Image.lz4"
          test -s "${OUT_DIR}/arch/arm64/boot/Image.lz4"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("out/arch/arm64/boot/Image.lz4")
          data = p.read_bytes()
          assert data[:4] == b"\x02\x21\x4c\x18", f"bad LZ4 magic: {data[:4]!r}"
          print(f"Image.lz4: {p.stat().st_size} bytes")
          PY

      - name: Build flashable AnyKernel3 ZIP
        run: |
          set -euo pipefail
          rm -rf ak3 dist debug
          mkdir -p dist debug

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          git fetch --depth=1 origin "${AK3_COMMIT}"
          git checkout --detach "${AK3_COMMIT}"
          cp "../${OUT_DIR}/arch/arm64/boot/Image.lz4" ./Image.lz4

          cat > anykernel.sh <<'AK3'
          ### AnyKernel3 Ramdisk Mod Script
          ## Aether-Foundry

          properties() {
          kernel.string=Aether-Foundry
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=bramble
          device.name2=redfin
          device.name3=barbet
          supported.versions=16,17
          supported.patchlevels=
          supported.vendorpatchlevels=
          }

          # AnyKernel3 resolves the active A/B suffix from IS_SLOT_DEVICE=1.
          # Do not manually append a suffix; the AK3 core handles this before
          # split_boot/flash_boot and selects the active slot by default.
          BLOCK=/dev/block/bootdevice/by-name/boot
          IS_SLOT_DEVICE=1
          SLOT_SELECT=active
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          # Kernel-only package: boot is the only partition ever targeted.
          case "$BLOCK" in
            */boot_a|*/boot_b) ;;
            *) abort "Resolved boot target is invalid: $BLOCK";;
          esac

          case "$(basename "$BLOCK")" in
            boot_a|boot_b) ;;
            *) abort "Unexpected boot target: $BLOCK";;
          esac

          DEVICE=$(getprop ro.product.device 2>/dev/null)
          BUILD_PRODUCT=$(getprop ro.build.product 2>/dev/null)
          VENDOR_DEVICE=$(getprop ro.product.vendor.device 2>/dev/null)
          VENDOR_PRODUCT=$(getprop ro.vendor.product.device 2>/dev/null)
          case "$DEVICE $BUILD_PRODUCT $VENDOR_DEVICE $VENDOR_PRODUCT" in
            *bramble*|*redfin*|*barbet*) ;;
            *) abort "Unsupported device: $DEVICE / $BUILD_PRODUCT / $VENDOR_DEVICE / $VENDOR_PRODUCT";;
          esac

          [ -b "$BLOCK" ] || abort "Boot block is not a block device: $BLOCK"
          ui_print "Aether-Foundry kernel-only installer"
          ui_print "Target boot: $BLOCK"
          ui_print "Active slot: $SLOT"

          split_boot

          [ -s "$BOOTIMG" ] || abort "Original boot image dump is empty. Aborting..."
          [ -s "$SPLITIMG/kernel.gz" ] || abort "Original kernel was not extracted. Aborting..."

          # Do not unpack/repack the ramdisk here. flash_boot replaces only
          # the kernel while retaining the original boot components.
          flash_boot

          [ -s "$AKHOME/boot-new.img" ] || abort "Rebuilt boot image is missing. Aborting..."
          NEW_SIZE=$(wc -c < "$AKHOME/boot-new.img")
          ORIGINAL_SIZE=$(wc -c < "$BOOTIMG")
          TARGET_SIZE=$(blockdev --getsize64 "$BLOCK" 2>/dev/null || echo 0)
          [ "$NEW_SIZE" -le "$ORIGINAL_SIZE" ] || abort "Rebuilt boot exceeds original image size. Aborting..."
          [ "$TARGET_SIZE" -gt 0 ] || abort "Unable to read target partition size. Aborting..."
          [ "$NEW_SIZE" -le "$TARGET_SIZE" ] || abort "Rebuilt boot exceeds target partition size. Aborting..."
          ui_print "Rebuilt boot: $NEW_SIZE bytes"
          AK3

          sed -i 's/^[[:space:]]*//' anykernel.sh
          chmod 755 anykernel.sh
          bash -n anykernel.sh

          # Never ship an accidentally generated boot image or vendor target.
          ! grep -Eq '(^|[[:space:]])(vendor_boot|vendor_kernel_boot|vendor_dlkm|system_dlkm|dtbo)([[:space:];]|$)' anykernel.sh
          grep -q '^BLOCK=/dev/block/bootdevice/by-name/boot$' anykernel.sh
          grep -q '^IS_SLOT_DEVICE=1$' anykernel.sh
          grep -q '^SLOT_SELECT=active$' anykernel.sh
          grep -q '^do.modules=0$' anykernel.sh
          grep -q '^kernel.string=Aether-Foundry$' anykernel.sh
          grep -q '^device.name1=bramble$' anykernel.sh
          grep -q '^device.name2=redfin$' anykernel.sh
          grep -q '^device.name3=barbet$' anykernel.sh
          grep -q '^supported.versions=16,17$' anykernel.sh
          grep -q '^flash_boot$' anykernel.sh

          ZIP="../dist/Aether-Foundry-redbull-test-24.0.zip"
          zip -q -r9 "$ZIP" . -x '.git/*' 'README.md'
          cd ..

          unzip -t "$ZIP" >/dev/null
          unzip -l "$ZIP" | grep -E '(^|/)Image\.lz4$|(^|/)anykernel\.sh$|META-INF/com/google/android/update-binary|(^|/)LICENSE$'
          test "$(unzip -Z1 "$ZIP" | grep -c '^Image\.lz4$')" -eq 1
          test "$(unzip -Z1 "$ZIP" | grep -c '^anykernel\.sh$')" -eq 1

      - name: Prepare build/debug artifact
        run: |
          set -euo pipefail
          cp "${OUT_DIR}/arch/arm64/boot/Image" debug/Image
          cp "${OUT_DIR}/arch/arm64/boot/Image.lz4" debug/Image.lz4
          cp "${OUT_DIR}/.config" debug/.config
          git rev-parse HEAD > debug/git-commit.txt
          printf 'Aether-Foundry\n' > debug/kernel-name.txt
          printf 'Neutron Clang %s\n' "${NEUTRON_VERSION}" > debug/toolchain.txt
          clang --version > debug/clang-version.txt
          ld.lld --version > debug/lld-version.txt
          make -s O="${OUT_DIR}" ARCH="${ARCH}" CC=clang LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" CROSS_COMPILE="${CROSS_COMPILE}" kernelrelease > debug/kernel-release.txt
          if [ -f "${OUT_DIR}/Module.symvers" ]; then cp "${OUT_DIR}/Module.symvers" debug/Module.symvers; fi
          if [ -f "${OUT_DIR}/modules.order" ]; then cp "${OUT_DIR}/modules.order" debug/modules.order; fi
          find "${OUT_DIR}" -type f -name '*.ko' -print | sort > debug/modules.list
          sha256sum debug/Image debug/Image.lz4 "dist/Aether-Foundry-redbull-test-24.0.zip" > debug/SHA256SUMS

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Foundry-redbull-test-24.0-FLASHABLE
          if-no-files-found: error
          path: dist/Aether-Foundry-redbull-test-24.0.zip

      - name: Upload build/debug files
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Foundry-redbull-test-24.0-BUILD-DEBUG
          if-no-files-found: error
          path: debug/
