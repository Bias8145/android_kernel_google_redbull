name: Build redbull Kernel (Android 16 QPR2)

on:
  workflow_dispatch:
  push:
    branches:
      - test
    paths:
      - '**.c'
      - '**.h'
      - '**.S'
      - '**.cpp'
      - '**Kconfig*'
      - '**Makefile*'
      - 'build.config*'
      - '.github/workflows/build-kernel.yml'

permissions:
  contents: read

env:
  KERNEL_BRANCH: test
  ARCH: arm64
  DEFCONFIG: redbull_defconfig
  CLANG_BRANCH: android16-qpr2-release
  CLANG_VERSION: clang-r563880
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

jobs:
  build:
    name: Build kernel + AnyKernel3
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex \
            libelf-dev libssl-dev lz4 rsync zip unzip \
            python3 python3-pip dwarves device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch AOSP Android 16 QPR2 Clang
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --filter=blob:none --sparse \
            -b "${CLANG_BRANCH}" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$RUNNER_TEMP/aosp-clang"
          git -C "$RUNNER_TEMP/aosp-clang" sparse-checkout set "${CLANG_VERSION}"
          echo "CLANG_BIN=$RUNNER_TEMP/aosp-clang/${CLANG_VERSION}/bin" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/aosp-clang/${CLANG_VERSION}/bin" >> "$GITHUB_PATH"
          clang --version
          ld.lld --version

      - name: Prepare kernel configuration
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          make O=out "${DEFCONFIG}"
          make O=out savedefconfig
          cp out/defconfig out/defconfig.final

      - name: Build kernel
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export LLVM_IAS=1
          make O=out -j"$(nproc)"

      - name: Verify build outputs
        run: |
          set -euxo pipefail
          test -s out/arch/arm64/boot/Image.lz4
          echo "Kernel: $(stat -c '%s bytes' out/arch/arm64/boot/Image.lz4)"
          ls -lh out/arch/arm64/boot/Image* || true
          find out/arch/arm64/boot/dts -type f \( -name '*.dtb' -o -name '*.dtbo' \) | head -50 || true
          test -s out/vmlinux
          test -s out/System.map

      - name: Prepare AnyKernel3
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf anykernel
          git clone --depth=1 "$ANYKERNEL_REPO" anykernel
          rm -rf anykernel/.git

          cp out/arch/arm64/boot/Image.lz4 anykernel/

          # Prefer a generated combined DTB when the kernel build provides one.
          if [ -s out/arch/arm64/boot/Image.lz4-dtb ]; then
            cp out/arch/arm64/boot/Image.lz4-dtb anykernel/
          fi

          # Pixel 4a 5G / redbull-family DTB. Keep separate DTB files when present;
          # AnyKernel3 will automatically place them in the appropriate partition
          # layout when the target device exposes vendor_boot.
          find out/arch/arm64/boot/dts -type f -name '*.dtb' -print -quit | while read -r dtb; do
            cp "$dtb" anykernel/dtb
          done

          cat > anykernel/anykernel.sh <<'EOF'
          # AnyKernel3 installer for Google redbull family / bramble
          properties() {
          kernel.string=Bias8145 redbull kernel - Android 16 QPR2
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=bramble
          device.name2=redfin
          device.name3=barbet
          supported.versions=
          supported.patchlevels=
          }

          # Use automatic detection so the same ZIP can handle the A/B boot
          # partition layout used by the redbull family.
          block=boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          chmod 0755 anykernel/anykernel.sh
          touch anykernel/banner
          printf '%s\n' 'Bias8145 redbull kernel - Android 16 QPR2' > anykernel/banner

          cd anykernel
          zip -r9 ../redbull-A16-QPR2-AnyKernel3.zip . \
            -x '.git/*' 'README.md' '*placeholder'

      - name: Collect build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redbull-A16-QPR2-kernel
          if-no-files-found: error
          compression-level: 0
          path: |
            out/arch/arm64/boot/Image.lz4
            out/arch/arm64/boot/Image.lz4-dtb
            out/vmlinux
            out/System.map
            out/.config
            redbull-A16-QPR2-AnyKernel3.zip
